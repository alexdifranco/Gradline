<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gradeline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Gradeline</title>
<script>try{var t=localStorage.getItem("gl-theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14213d;--mut:#6b7590;--line:#e1e5ee;--accent:#2b59ff;--A:#0e9f7e;--B:#2b59ff;--C:#d99a00;--D:#e2662c;--F:#d62f45}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0f1524;--card:#18203a;--ink:#eef1f8;--mut:#98a2bf;--line:#273152;--accent:#7a99ff;--A:#2fcf9f;--B:#7a99ff;--C:#f2bd3a;--D:#f58a55;--F:#ff6b81}}
:root[data-theme=dark]{--bg:#0f1524;--card:#18203a;--ink:#eef1f8;--mut:#98a2bf;--line:#273152;--accent:#7a99ff;--A:#2fcf9f;--B:#7a99ff;--C:#f2bd3a;--D:#f58a55;--F:#ff6b81}
:root[data-theme=midnight]{--bg:#000;--card:#111318;--ink:#f2f2f5;--mut:#8b8f9c;--line:#23262e;--accent:#a78bfa;--A:#34d399;--B:#60a5fa;--C:#fbbf24;--D:#fb923c;--F:#f87171}
:root[data-theme=ocean]{--bg:#0b2530;--card:#11374a;--ink:#e8f6fb;--mut:#8fb5c4;--line:#1d4d63;--accent:#4cc9f0;--A:#3ddc97;--B:#4cc9f0;--C:#ffd166;--D:#ff9f68;--F:#ff6b81}
:root[data-theme=forest]{--bg:#eef3ea;--card:#fbfdf8;--ink:#1f3326;--mut:#5f7566;--line:#d6e0cf;--accent:#2f7d4f;--A:#2f7d4f;--B:#2a6fb0;--C:#b8860b;--D:#c8581f;--F:#b83a3a}
:root[data-theme=sunset]{--bg:#fff3ea;--card:#fff;--ink:#3b1f2b;--mut:#8a6572;--line:#f2d9cc;--accent:#e4572e;--A:#1b9e77;--B:#3b6fd4;--C:#d99a00;--D:#e4572e;--F:#c9184a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:640px;margin:auto;padding:12px 16px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
h1{font-size:26px;letter-spacing:-.02em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:15px;margin:20px 0 8px}
small{color:var(--mut);display:block;font-size:13px}
button{font:inherit;cursor:pointer}
.pill{border:0;background:var(--card);color:var(--accent);padding:8px 14px;border-radius:99px;font-weight:600;box-shadow:0 0 0 1px var(--line)}
.bad{color:var(--F)}
.row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:0;color:inherit;padding:12px 14px;border-radius:18px;margin-bottom:10px;box-shadow:0 0 0 1px var(--line)}
.row span{flex:1;min-width:0}
.row h3{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;font-weight:700;font-size:14px}.up{color:var(--A)}.dn{color:var(--F)}
.ring{--s:56px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:calc(var(--s)*.11);border-radius:50%;background:var(--card)}
.ring b{position:relative;font-size:14px}
.hero{display:flex;align-items:center;gap:20px;margin-bottom:6px}
.hero .ring{--s:112px}.hero .ring b{font-size:22px}
.hero b{display:block;font-size:20px}
.gpa{display:flex;gap:10px;margin-bottom:14px}
.gpa div{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px var(--line)}
.gpa b{font-size:30px;letter-spacing:-.02em}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
label{font-size:13px;color:var(--mut);display:block}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.as{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.as input,.as select{margin:0}.as .n{flex:1 1 100%}.as .num{width:76px;flex:none}.as select{flex:1}.as span{color:var(--mut)}
.as.mock{border-left:3px solid var(--accent);padding-left:8px}
.as button{border:0;background:none;color:var(--mut);font-size:18px;margin-left:auto}
.needed{display:flex;gap:6px;flex-wrap:wrap}.needed input,.needed select{flex:1;min-width:90px}
.hint,.empty,#nres{color:var(--mut);font-size:14px;margin:8px 0}
.gr{display:grid;grid-template-columns:1fr 96px 64px 78px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.gr input,.gr select{margin:0;padding:6px}
.gr b{text-align:center}
.two{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;max-width:200px;border:0;background:none;color:var(--mut);padding:10px;border-radius:12px;font-weight:600}
nav .on{color:var(--accent);background:var(--bg)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;font-size:14px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.sw{border:0;border-radius:14px;padding:8px;color:var(--ink);background:var(--bg);box-shadow:0 0 0 1px var(--line);font-size:13px}.sw i{display:block;height:34px;border-radius:9px;margin-bottom:6px;border:1px solid var(--line)}.sw.on{box-shadow:0 0 0 2px var(--accent);font-weight:700}
summary{cursor:pointer;margin:20px 0 8px;font-size:15px;font-weight:700}
a.pill{text-decoration:none;display:inline-block}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{min-height:90px;font-size:13px}
</style></head><body>
<main id="app"></main><div id="toast" role="status"></div>
<nav><button data-t="grades">Grades</button><button data-t="gpa">GPA</button><button data-t="connect">Connect</button><button data-t="settings">Settings</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9),num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const DEF={classes:[],scale:{A:90,B:80,C:70,D:60},bonus:{Regular:0,Honors:.5,AP:1},sync:{proxy:'',base:'',district:'',user:''}};
let S=(()=>{try{const s=JSON.parse(localStorage.getItem('gl1'));return s?{...DEF,...s}:structuredClone(DEF)}catch{return structuredClone(DEF)}})(),view={t:'grades',id:null},WI={};
const save=()=>{try{localStorage.setItem('gl1',JSON.stringify(S))}catch{}};
S.sync=S.sync||{};S.sync.base=S.sync.base||'https://eastchesterny.infinitecampus.org/campus/portal/students/eastchester.jsp';S.sync.district=S.sync.district||'eastchester';
const THEMES=[['auto','Auto','#f2f4f8','#0f1524','#2b59ff'],['light','Light','#f2f4f8','#fff','#2b59ff'],['dark','Dark','#0f1524','#18203a','#7a99ff'],['midnight','Midnight','#000','#111318','#a78bfa'],['ocean','Ocean','#0b2530','#11374a','#4cc9f0'],['forest','Forest','#eef3ea','#fbfdf8','#2f7d4f'],['sunset','Sunset','#fff3ea','#fff','#e4572e']];
const curTheme=()=>{try{return localStorage.getItem('gl-theme')||'auto'}catch{return'auto'}};
function applyMeta(){const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#14213d'}
function setTheme(v){try{localStorage.setItem('gl-theme',v)}catch{}v==='auto'?delete document.documentElement.dataset.theme:document.documentElement.dataset.theme=v;applyMeta()}
const BM='javascript:(()=>{const P=(async()=>{const r=await fetch("/campus/resources/portal/grades",{credentials:"include"});if(!r.ok)throw Error("Not signed in (status "+r.status+")");const d=await r.json(),o=[];for(const en of[].concat(d)){let p=null;for(const t of en.terms||[])if((t.courses||[]).some(c=>(c.gradingTasks||[]).some(g=>g.progressPercent!=null)))p=t;for(const c of(p&&p.courses)||[]){const g=(c.gradingTasks||[]).filter(g=>g.progressPercent!=null).pop();o.push({name:c.courseName||c.sectionName||"Course",teacher:c.teacherDisplay||"",pct:g?g.progressPercent:null,sid:c.sectionID})}}if(!o.length)throw Error("No graded courses found");return new Blob(["GRADELINE:"+JSON.stringify(o)],{type:"text/plain"})})();(async()=>{try{await navigator.clipboard.write([new ClipboardItem({"text/plain":P})]);alert("Grades copied. Open Gradeline and tap Import.")}catch(e){try{prompt("Copy this, then paste it into Gradeline:",await(await P).text())}catch(e2){alert("Gradeline could not read grades: "+e2.message)}}})()})();void 0';
const RB='javascript:(async()=>{try{const r=await fetch("/campus/resources/portal/grades",{credentials:"include"});if(!r.ok)throw Error("Not signed in (status "+r.status+")");const d=await r.json(),o=[];for(const en of[].concat(d)){let p=null;for(const t of en.terms||[])if((t.courses||[]).some(c=>(c.gradingTasks||[]).some(g=>g.progressPercent!=null)))p=t;for(const c of(p&&p.courses)||[]){const g=(c.gradingTasks||[]).filter(g=>g.progressPercent!=null).pop();o.push({name:c.courseName||c.sectionName||"Course",teacher:c.teacherDisplay||"",pct:g?g.progressPercent:null,sid:c.sectionID})}}if(!o.length)throw Error("No graded courses found");await new Promise((ok,no)=>{const i=new Image();i.onload=ok;i.onerror=()=>no(Error("could not reach your Gradeline relay"));i.src="@@R@@/put?k=@@K@@&d="+encodeURIComponent(JSON.stringify(o))});alert("Gradeline updated ("+o.length+" classes). Open the app.")}catch(e){alert("Gradeline could not update: "+e.message)}})();void 0';
const bmCode=()=>{const y=S.sync;return y.relay&&y.key?RB.split('@@R@@').join(y.relay.replace(/\/+$/,'')).split('@@K@@').join(y.key):BM};
const mk=n=>({id:uid(),name:n,teacher:'',lv:'Regular',cr:1,pct:null,bp:400,cats:[],items:[]});
const cur=()=>S.classes.find(c=>c.id===view.id);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function calc(c,mock=true){
 const real=c.items.filter(i=>!i.mock&&i.e!=null&&i.t>0);let its=real.slice();
 if(!real.length&&c.pct!=null)its=[{e:c.pct*c.bp/100,t:c.bp}];
 if(mock)its=its.concat(c.items.filter(i=>i.mock&&i.e!=null&&i.t>0));
 if(!its.length)return null;
 const W=c.cats.filter(k=>k.w>0);
 if(W.length&&real.length){let sw=0,s=0;for(const k of W){const g=its.filter(i=>i.c===k.n),t=g.reduce((a,i)=>a+i.t,0);if(t){s+=k.w*g.reduce((a,i)=>a+i.e,0)/t;sw+=k.w}}if(sw)return s/sw*100}
 const t=its.reduce((a,i)=>a+i.t,0);return t?its.reduce((a,i)=>a+i.e,0)/t*100:null}
const letter=p=>{const s=S.scale;return p>=s.A?'A':p>=s.B?'B':p>=s.C?'C':p>=s.D?'D':'F'};
function gpa(){let w=0,u=0,cr=0;for(const c of S.classes){const p=WI[c.id]??calc(c);if(p==null||!c.cr)continue;const L=letter(p),b=L==='F'?0:(S.bonus[c.lv]||0),k={A:4,B:3,C:2,D:1,F:0}[L];w+=(k+b)*c.cr;u+=k*c.cr;cr+=c.cr}return cr?{w:w/cr,u:u/cr}:null}
const ring=p=>`<div class="ring" style="--p:${p==null?0:Math.min(100,p)};--c:var(--${p==null?'mut':letter(p)})"><b>${p==null?'–':p.toFixed(1)}</b></div>`;
const gpaBox=g=>g?`<section class="gpa"><div><small>Weighted GPA</small><b>${g.w.toFixed(2)}</b></div><div><small>Unweighted GPA</small><b>${g.u.toFixed(2)}</b></div></section>`:'';
function row(c){const p=calc(c),a=calc(c,false),d=p!=null&&a!=null?p-a:0;
 return `<button class="row" data-a="open" data-id="${c.id}">${ring(p)}<span><h3>${esc(c.name)}</h3><small>${esc(c.teacher?c.teacher+', ':'')}${c.lv}</small></span>${Math.abs(d)>.05?`<em class="${d>0?'up':'dn'}">${d>0?'+':''}${d.toFixed(1)}</em>`:''}</button>`}
function grades(){const g=gpa(),b=S.sync.base||'',ok=/^https:\/\//.test(b);return `<header><h1>Grades</h1><button class="pill" data-a="importnow">Import</button><button class="pill" data-a="addc">Add</button></header>${gpaBox(g)}${S.classes.length?'':'<section class="card"><b>Get your grades in</b><p class="hint">Open the Connect tab. It walks you through a one-time bookmark setup, then signing in with Google and tapping Import.</p></section>'}${S.classes.map(row).join('')}<p class="hint">${S.last?'Imported '+new Date(S.last).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})+'. ':''}${ok?`<a href="${esc(b)}" target="_blank" rel="noopener" style="color:var(--accent)">Open Infinite Campus</a>`:''}</p>`}
function detail(c){
 if(!c){view.id=null;return grades()}
 const p=calc(c),a=calc(c,false),real=c.items.some(i=>!i.mock),cs=c.cats.length?`<select id="nc">${c.cats.map(k=>`<option>${esc(k.n)}</option>`).join('')}</select>`:'';
 const it=i=>`<div class="as${i.mock?' mock':''}"><input class="n" value="${esc(i.n)}" placeholder="${i.mock?'What-if assignment':'Assignment'}" data-f="i" data-k="n" data-i="${i.id}">${c.cats.length?`<select data-f="i" data-k="c" data-i="${i.id}"><option value="">No category</option>${c.cats.map(k=>`<option${k.n===i.c?' selected':''}>${esc(k.n)}</option>`).join('')}</select>`:''}<input class="num" type="number" step="any" inputmode="decimal" value="${i.e??''}" placeholder="Score" data-f="i" data-k="e" data-i="${i.id}"><span>/</span><input class="num" type="number" step="any" inputmode="decimal" value="${i.t??''}" placeholder="Out of" data-f="i" data-k="t" data-i="${i.id}"><button data-a="deli" data-i="${i.id}" aria-label="Delete assignment">✕</button></div>`;
 return `<header><button class="pill" data-a="back">Back</button><h1>${esc(c.name)}</h1><button class="pill bad" data-a="delc">Delete</button></header>
 <section class="hero">${ring(p)}<div><small>Current</small><b>${a==null?'–':a.toFixed(2)}%</b><small>With what-ifs</small><b>${p==null?'–':p.toFixed(2)}%</b></div></section>
 <section class="card form"><label>Level<select data-f="c" data-k="lv">${['Regular','Honors','AP'].map(l=>`<option${l===c.lv?' selected':''}>${l}</option>`).join('')}</select></label>
 <label>Credits<input type="number" step="0.25" value="${c.cr}" data-f="c" data-k="cr"></label>
 ${real?'':`<label>Portal grade (%)<input type="number" step="0.01" value="${c.pct??''}" data-f="c" data-k="pct"></label><label>Points graded so far<input type="number" value="${c.bp}" data-f="c" data-k="bp"></label>`}
 <label class="wide">Category weights (optional)<input value="${esc(c.cats.map(k=>k.n+' '+k.w).join(', '))}" placeholder="Tests 40, Homework 30, Quizzes 30" data-f="cats"></label></section>
 <h2>Score needed on the next assignment</h2><section class="card"><div class="needed"><input id="tg" type="number" value="90" aria-label="Target average"><input id="np" type="number" value="100" aria-label="Points possible">${cs}<button class="pill" data-a="need">Calculate</button></div><p id="nres">Enter a target average and the points the assignment is worth.</p></section>
 <h2>Assignments</h2><section class="card">${c.items.map(it).join('')||'<p class="hint">Add graded assignments for an exact average, or what-ifs to test scores you have not earned yet.</p>'}<div class="row-btns"><button class="pill" data-a="addi">Add assignment</button><button class="pill" data-a="addm">Add what-if</button></div></section>`}
function gpaV(){return `<header><h1>GPA</h1><button class="pill" data-a="resetwi">Reset what-ifs</button></header>${gpaBox(gpa())||'<p class="empty">Add classes with grades to see your GPA.</p>'}
 <p class="hint">Type an average in the What-if column to see how it moves your GPA. Saved grades stay the same.</p><section class="card">
 <div class="gr"><small>Class</small><small>Level</small><small>Credits</small><small>What-if %</small></div>
 ${S.classes.map(c=>{const p=calc(c);return `<div class="gr"><span>${esc(c.name)} <b style="color:var(--${letter(WI[c.id]??p??0)})">${p==null&&WI[c.id]==null?'':letter(WI[c.id]??p)}</b></span><select data-f="c" data-k="lv" data-id="${c.id}">${['Regular','Honors','AP'].map(l=>`<option${l===c.lv?' selected':''}>${l}</option>`).join('')}</select><input type="number" step="0.25" value="${c.cr}" data-f="c" data-k="cr" data-id="${c.id}"><input type="number" step="any" placeholder="${p==null?'–':p.toFixed(1)}" value="${WI[c.id]??''}" data-f="wi" data-id="${c.id}"></div>`}).join('')}</section>`}
function settings(){const y=S.sync,sc=S.scale,b=S.bonus;
 return `<header><h1>Settings</h1></header>
 <h2>Theme</h2><section class="card themes">${THEMES.map(t=>`<button class="sw${t[0]===curTheme()?' on':''}" data-a="theme" data-v="${t[0]}"><i style="background:${t[0]==='auto'?`linear-gradient(120deg,${t[2]} 50%,${t[3]} 50%)`:`linear-gradient(120deg,${t[2]} 0 45%,${t[3]} 45% 70%,${t[4]} 70%)`}"></i>${t[1]}</button>`).join('')}</section>
 <h2>Grade scale (minimum % for each letter)</h2><section class="card two">${['A','B','C','D'].map(k=>`<label>${k}<input type="number" value="${sc[k]}" data-f="s" data-k="${k}"></label>`).join('')}</section>
 <h2>Weighted GPA bonus</h2><section class="card two">${['Honors','AP'].map(k=>`<label>${k}<input type="number" step="0.1" value="${b[k]}" data-f="b" data-k="${k}"></label>`).join('')}</section>
 <details><summary>Advanced: username and password sync (needs a proxy)</summary><section class="card form"><p class="hint wide">Needs your own grade proxy (worker.js, free on Cloudflare). Your password is sent only to that proxy and is never saved here.</p>
 <label class="wide">Proxy URL<input value="${esc(y.proxy)}" placeholder="https://gradeline.you.workers.dev" data-f="sy" data-k="proxy"></label>
  <label>District name (appName)<input value="${esc(y.district)}" data-f="sy" data-k="district"></label><label>Username<input value="${esc(y.user)}" autocomplete="username" data-f="sy" data-k="user"></label>
 <label class="wide">Password<input id="pw" type="password" autocomplete="current-password"></label><button class="pill wide" data-a="sync">Sync grades</button></section></details>
 <h2>Your data</h2><section class="card"><textarea id="dj" placeholder="Export fills this box. Paste a backup here and choose Import."></textarea>
 <div class="row-btns"><button class="pill" data-a="export">Export</button><button class="pill" data-a="import">Import</button><button class="pill" data-a="demo">Load sample data</button><button class="pill bad" data-a="clear">Erase everything</button></div></section>`}
function connect(){const y=S.sync;return `<header><h1>Connect</h1></header>
 <p class="hint">Gradeline can't type your Google login for you, so it borrows the page you are already signed in to. Set it up once, then fresh grades take a few taps.</p>
 <h2>One time</h2><section class="card"><p class="hint">1. Tap Copy bookmark code.<br>2. In Safari, bookmark any page (Share, then Add Bookmark). Open Bookmarks, tap Edit, tap that bookmark, name it Gradeline, and replace its address with the code (press and hold in the address box, then Paste).<br>3. Tap Done.</p><div class="row-btns"><button class="pill" data-a="copybm">Copy bookmark code</button></div></section>
 <h2>Whenever you want fresh grades</h2><section class="card"><p class="hint">4. In Safari, open your school login and sign in with Google.<br>5. Tap Bookmarks, then Gradeline, and wait for the copied message.<br>6. Come back to Gradeline and tap Import.</p><div class="row-btns"><a class="pill" href="${esc(y.base||'#')}" target="_blank" rel="noopener">Open school login</a><button class="pill" data-a="importnow">Import</button></div><p class="hint">Tip: if the link opens inside this app, bookmark your school login in Safari and use that instead.</p></section>
 <details><summary>More options</summary><section class="card form">
 <label class="wide">School login address<input value="${esc(y.base||'')}" data-f="sy" data-k="base"></label>
 <label class="wide">Relay URL (optional, makes it one tap; see relay.js)<input value="${esc(y.relay||'')}" placeholder="https://gradeline-relay.you.workers.dev" data-f="sy" data-k="relay"></label>
 <label class="wide">Bookmark code${y.relay&&y.key?' (one-tap version)':''}<textarea id="bm" readonly>${esc(bmCode())}</textarea></label>
 <label class="wide">Paste grades here<textarea id="ic" placeholder="GRADELINE:[..."></textarea></label><div class="row-btns wide"><button class="pill" data-a="pasteic">Paste from clipboard</button><button class="pill" data-a="importic">Import pasted grades</button></div></section></details>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===view.t));$('#app').innerHTML=view.id?detail(cur()):({grades,gpa:gpaV,connect,settings})[view.t]()}
function mapIC(d){const out=[];for(const en of [].concat(d||[])){let pick=null;for(const t of en.terms||[])if((t.courses||[]).some(c=>(c.gradingTasks||[]).some(g=>g.progressPercent!=null)))pick=t;
 for(const c of pick?.courses||[]){const g=(c.gradingTasks||[]).filter(g=>g.progressPercent!=null).pop();out.push({name:c.courseName||c.sectionName||'Course',teacher:c.teacherDisplay||'',pct:g?g.progressPercent:null,sid:c.sectionID})}}return out}
function merge(list){for(const x of list){let c=S.classes.find(c=>x.sid!=null&&c.sid==x.sid)||S.classes.find(c=>c.name===x.name);if(!c){c=mk(x.name);S.classes.push(c)}Object.assign(c,{sid:x.sid,teacher:x.teacher||'',pct:x.pct})}S.last=Date.now();save()}
function importText(t){try{const l=JSON.parse(t.trim().replace(/^GRADELINE:/,''));if(!Array.isArray(l)||!l.length||!l.every(x=>x&&x.name))throw 0;merge(l);toast('Imported '+l.length+' classes.');view={t:'grades',id:null};render()}catch{toast('That does not look like text copied by the Gradeline bookmark.')}}
const importIC=()=>importText($('#ic').value);
async function pull(){const y=S.sync;if(!y.relay||!y.key)return false;try{const r=await fetch(y.relay.replace(/\/+$/,'')+'/get?k='+y.key,{cache:'no-store'});if(!r.ok)return false;const j=await r.json();if(!j||!Array.isArray(j.d)||j.t<=(S.relayT||0))return false;merge(j.d);S.relayT=j.t;save();toast('Grades updated from Infinite Campus.');return true}catch{return false}}
async function importNow(){if(S.sync.relay&&S.sync.key){const ok=await pull();if(!ok)toast('No new grades yet. Tap the Gradeline bookmark in Infinite Campus first.');return render()}try{const t=await navigator.clipboard.readText();if(!/^\s*GRADELINE:/.test(t))return toast('Nothing to import yet. Tap the Gradeline bookmark in Infinite Campus first.');importText(t)}catch{view={t:'connect',id:null};render();document.querySelector('details')?.setAttribute('open','');toast('Paste your grades into the box and tap Import.')}}
async function sync(){const y=S.sync,pw=$('#pw').value;if(!y.proxy||!y.base||!y.district||!y.user||!pw)return toast('Fill in every sync field first.');toast('Syncing…');
 try{const r=await fetch(y.proxy,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base:y.base.replace(/\/+$/,''),district:y.district,username:y.user,password:pw})});
  if(!r.ok)throw Error(r.status===401?'Login failed. Check username, password and district name.':'Proxy returned error '+r.status);
  const list=mapIC(await r.json());if(!list.length)throw Error('Logged in, but no graded courses were found in the response.');
  merge(list);toast('Synced '+list.length+' classes.')}catch(e){toast(e.message)}}
function need(){const c=cur(),tg=num($('#tg').value),x=num($('#np').value)||100,k=$('#nc')?.value||'',o=c.items;
 const f=e=>{c.items=o.concat({id:'x',mock:true,e,t:x,c:k});const r=calc(c);c.items=o;return r};let m;
 if(tg==null)m='Enter a target average.';else if(f(0)>=tg)m='You stay at or above '+tg+'% even with a zero.';else if(f(x*3)<tg)m='Not reachable with this assignment alone.';
 else{let lo=0,hi=x*3;for(let i=0;i<40;i++){const mid=(lo+hi)/2;f(mid)<tg?lo=mid:hi=mid}m=`Score at least ${hi.toFixed(1)} of ${x} (${(hi/x*100).toFixed(1)}%) to reach ${tg}%.`}
 $('#nres').textContent=m}
function demo(){const d=(n,t,lv,its,cats)=>{const c=mk(n);c.teacher=t;c.lv=lv;c.cats=cats||[];c.items=its.map(([a,e,t,k])=>({id:uid(),n:a,c:k||'',e,t}));return c};
 S.classes=[d('AP Calculus','Ms. Rivera','AP',[['Quiz 1',18,20,'Quizzes'],['Test 1',88,100,'Tests'],['Quiz 2',17,20,'Quizzes'],['Test 2',92,100,'Tests']],[{n:'Tests',w:60},{n:'Quizzes',w:40}]),
 d('AP Physics','Mr. Chen','AP',[['Lab 1',45,50],['Test 1',81,100],['HW 3',9,10],['Lab 2',48,50]]),d('English 12','Mrs. Patel','Regular',[['Essay 1',46,50],['Reading quiz',9,10],['Essay 2',43,50]]),
 d('Gov & Econ','Mr. Lopez','Honors',[['Debate',95,100],['Unit test',90,100],['Project',48,50]])];toast('Sample data loaded.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t]');if(!b)return;
 if(b.dataset.t){view={t:b.dataset.t,id:null};return render()}
 const a=b.dataset.a,c=cur();
 if(a==='open')view.id=b.dataset.id;
 else if(a==='back')view.id=null;
 else if(a==='theme')setTheme(b.dataset.v);
 else if(a==='addc'){const n=prompt('Class name');if(!n)return;const p=num(prompt('Current grade % (optional)')),k=mk(n.trim());k.pct=p;S.classes.push(k);save()}
 else if(a==='delc'){if(!confirm('Delete '+c.name+'?'))return;S.classes=S.classes.filter(x=>x!==c);view.id=null;save()}
 else if(a==='addi'||a==='addm'){c.items.push({id:uid(),n:'',c:'',e:null,t:100,mock:a==='addm'});save()}
 else if(a==='deli'){c.items=c.items.filter(i=>i.id!==b.dataset.i);save()}
 else if(a==='need')return need();
 else if(a==='copybm'){navigator.clipboard.writeText(bmCode()).then(()=>toast('Copied. Now add it as a Safari bookmark.')).catch(()=>{toast('Could not copy. Open More options and copy the code by hand.')});return}
 else if(a==='pasteic'){navigator.clipboard.readText().then(t=>{$('#ic').value=t}).catch(()=>toast('Press and hold the box, then choose Paste.'));return}
 else if(a==='importic')return importIC();
 else if(a==='importnow')return importNow();
 else if(a==='resetwi')WI={};
 else if(a==='sync')return sync().then(render);
 else if(a==='export'){$('#dj').value=JSON.stringify(S);return}
 else if(a==='import'){try{S={...DEF,...JSON.parse($('#dj').value)};save();toast('Imported.')}catch{return toast('That is not valid backup data.')}}
 else if(a==='demo'){demo();save()}
 else if(a==='clear'){if(!confirm('Erase all classes and settings on this device?'))return;S=structuredClone(DEF);WI={};save()}
 render()});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset.f;if(!f)return;const k=el.dataset.k,c=S.classes.find(x=>x.id===(el.dataset.id||view.id)),v=el.type==='number'?num(el.value):el.value;
 if(f==='c'){c[k]=['cr','pct','bp'].includes(k)?(v??(k==='cr'?1:null)):v}
 else if(f==='i'){const i=c.items.find(x=>x.id===el.dataset.i);i[k]=v}
 else if(f==='cats')c.cats=el.value.split(',').map(s=>s.trim().match(/^(.+?)\s+(\d+(?:\.\d+)?)%?$/)).filter(Boolean).map(m=>({n:m[1].trim(),w:parseFloat(m[2])}));
 else if(f==='wi'){v==null?delete WI[c.id]:WI[c.id]=v}
 else if(f==='s')S.scale[k]=v??S.scale[k];else if(f==='b')S.bonus[k]=v??0;else if(f==='sy'){S.sync[k]=el.value.trim();if(k==='relay'&&S.sync.relay&&!S.sync.key)S.sync.key=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('')}
 save();if((f!=='sy'&&f!=='s'&&f!=='b')||k==='relay')render()});
applyMeta();render();pull().then(ok=>ok&&render());document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull().then(ok=>ok&&render())});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
